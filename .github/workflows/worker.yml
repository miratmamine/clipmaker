# Worker ClipMaker : transcrit chez Groq, découpe et sous-titre les clips, puis
# les envoie dans Supabase Storage. Il travaille sur une vidéo YouTube ou sur
# une vidéo envoyée depuis le téléphone (bucket Supabase).
#
# Déclencheurs :
# - repository_dispatch : envoyé par l'interface Render à chaque job
#   (immédiat) ;
# - workflow_dispatch : bouton « Run workflow » pour tester à la main ;
# - schedule : filet de sécurité toutes les 15 minutes si le dispatch a échoué.
#
# Coût : gratuit et illimité sur un dépôt PUBLIC (2000 min/mois sur un dépôt
# privé). Le job s'arrête en quelques secondes quand la file est vide.

name: ClipMaker worker

on:
  repository_dispatch:
    types: [clipmaker-job]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      # File d'attente et stockage (secrets du dépôt).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_BUCKET: clips
      # Transcription et sélection (Groq).
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_WHISPER_MODEL: whisper-large-v3-turbo
      GROQ_RPM: "20"
      GROQ_CHUNK_SECONDS: "600"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      # Rétention et reprise après incident.
      RETENTION_DAYS: "14"
      MAX_STORAGE_MB: "900"
      SOURCE_RETENTION_DAYS: "3"
      JOB_RETENTION_DAYS: "60"
      STALE_MINUTES: "15"
      # Proxy résidentiel optionnel (secret YTDLP_PROXY) : seule parade durable
      # au blocage des adresses de datacenter par YouTube.
      YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Jeton PO YouTube (aide yt-dlp quand l'IP du runner est surveillée).
          pip install bgutil-ytdlp-pot-provider

      - name: Installer ffmpeg et les polices
        # L'image ubuntu-latest ne fournit plus ffmpeg/ffprobe : le pipeline en a
        # besoin pour l'audio, la découpe et les sous-titres.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation

      - name: Vérifier ffmpeg et les polices
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          fc-list | grep -ci "liberation\|dejavu"

      - name: Installer les cookies YouTube (si configurés)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" | base64 -d > "$RUNNER_TEMP/cookies.txt"
            echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
            echo "Cookies YouTube installés."
          else
            echo "Aucun cookie YouTube : téléchargement direct (souvent bloqué)."
          fi

      - name: Démarrer le fournisseur de jetons PO
        continue-on-error: true
        run: |
          docker run -d --name bgutil -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:latest || true

      - name: Traiter un job
        # Le contexte « runner » n'est autorisé qu'au niveau d'une étape.
        env:
          CLIPMAKER_DATA_DIR: ${{ runner.temp }}/clipmaker
        run: python worker.py --once
