services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: clipmaker
      POSTGRES_DB: clipmaker
    ports:
      - "5433:5432"
    volumes:
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - clipmaker-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clipmaker"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:7860
      - --workers
      - "1"
      - --threads
      - "4"
      - --timeout
      - "120"
      - webapp:app
    environment: &cloud-env
      DATABASE_URL: postgresql://postgres:clipmaker@db:5432/clipmaker
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-clips}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_WHISPER_MODEL: ${GROQ_WHISPER_MODEL:-whisper-large-v3-turbo}
      GROQ_LANGUAGE: ${GROQ_LANGUAGE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-900}
      PORT: "7860"
    ports:
      - "7860:7860"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python worker.py
    environment: *cloud-env
    depends_on:
      db:
        condition: service_healthy

volumes:
  clipmaker-db:
